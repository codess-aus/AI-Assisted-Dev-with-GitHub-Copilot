stages:
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  REGISTRY: registry.gitlab.com
  IMAGE_NAME: $REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME

cache:
  paths:
    - .cache/pip
    - venv/

test:python:
  stage: test
  image: python:3.11
  before_script:
    - pip install --upgrade pip
    - pip install pytest pytest-cov flake8 bandit
  script:
    - flake8 . --count --exit-zero --max-line-length=127
    - pytest --cov=blueprint_decoder --cov-report=xml --cov-report=html --cov-fail-under=80
    - bandit -r . -f json -o bandit-report.json || true
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      sast: bandit-report.json
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    expire_in: 30 days
  coverage: '/TOTAL\s+\d+\s+\d+\s+([\d.]+)%/'

test:csharp:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:6.0
  script:
    - dotnet test --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"
    - dotnet test /p:CollectCoverageMetricsPerTest=true
  artifacts:
    reports:
      junit: "**/test-results.trx"
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    expire_in: 30 days

test:javascript:
  stage: test
  image: node:18
  before_script:
    - npm install
  script:
    - npm run lint
    - npm run test -- --coverage --coverageReporters=cobertura
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
      junit: junit-results.xml
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    expire_in: 30 days

build:docker:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
  script:
    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHA -t $IMAGE_NAME:latest .
    - docker push $IMAGE_NAME:$CI_COMMIT_SHA
    - docker push $IMAGE_NAME:latest
  only:
    - main
    - tags

security:scan:
  stage: test
  image: python:3.11
  before_script:
    - pip install --upgrade pip
    - pip install bandit detect-secrets
  script:
    - bandit -r . -f json -o bandit-report.json || true
    - detect-secrets scan --baseline .secrets.baseline
  artifacts:
    reports:
      sast: bandit-report.json
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    expire_in: 30 days
  allow_failure: true

deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      curl -X POST "https://staging-api.example.com/deploy" \
        -H "Authorization: Bearer $DEPLOYMENT_TOKEN" \
        -H "Content-Type: application/json" \
        -d "{\"image\": \"$IMAGE_NAME:$CI_COMMIT_SHA\", \"environment\": \"staging\"}"
  only:
    - main
  environment:
    name: staging
    url: https://staging.example.com
  when: manual

deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      curl -X POST "https://prod-api.example.com/deploy" \
        -H "Authorization: Bearer $DEPLOYMENT_TOKEN" \
        -H "Content-Type: application/json" \
        -d "{\"image\": \"$IMAGE_NAME:$CI_COMMIT_SHA\", \"environment\": \"production\"}"
  only:
    - tags
  environment:
    name: production
    url: https://example.com
  when: manual
